name: Publish desktop installers

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: ./scripts/make_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: build/ClipStack.dmg

  windows:
    name: Test and build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
        working-directory: windows
      - run: npm run typecheck
        working-directory: windows
      - run: npm run check:main
        working-directory: windows
      - run: npm test
        working-directory: windows
      - run: npm run package:win
        working-directory: windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: windows/release/ClipStack-Setup.exe

  release:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [macos, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          name: ClipStack ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/ClipStack.dmg
            release-assets/ClipStack-Setup.exe
          body: |
            ## Downloads
            - **macOS:** [ClipStack.dmg](https://github.com/Digimo2020/ClipStack/releases/latest/download/ClipStack.dmg)
            - **Windows 10/11:** [ClipStack-Setup.exe](https://github.com/Digimo2020/ClipStack/releases/latest/download/ClipStack-Setup.exe)

            Windows installer is unsigned and may show a SmartScreen prompt. Clipboard history is stored locally on your PC.
